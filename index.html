<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progreso Vacacional</title>
    <style>
        /* Estilos Base y de Contenedor */
        body {
            font-family: Arial, sans-serif;
            background: #1c1c1c;            
            margin: 20px;
            padding: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #dee2e6;              
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }
        .container {
            color: #dee2e6;              
            margin-bottom: 20px;
        }
        .result-box {
            background-color: #2a2a2a;        /* Fondo más oscuro para caja de resultados */
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 4px;
        }
        .progress-bar {
            width: 100%;
            height: 25px;
            background-color: #555; /* Fondo de la barra */
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
            border: 1px solid #ccc;
        }
        .progress-fill {
            height: 100%;
            background-color: #007bff;
            text-align: center;
            line-height: 25px;
            color: white;
            font-weight: bold;
            transition: width 0.5s;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input[type="date"],
        input[type="number"] {
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #444; /* color de fondo del input */
            color: #dee2e6;
            margin-top: 4px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #343a40;
            border: 1px solid #007bff;
            color: #dee2e6;
        }
        .btn-secondary:hover {
            background-color: #007bff;
            color: #ffffff;
        }
        .color_label {
            color: #dee2e6;            
        }

        /* ESTILOS PARA EL DESPLEGABLE */
        .toggle-section {
            margin-top: 15px;
            cursor: pointer;
            color: #007bff; /* Color llamativo para el botón */
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #555;
            padding-top: 10px;
            user-select: none; /* Evita que se seleccione el texto */
        }

        .toggle-section:hover {
            color: #ffffff;
        }

        .vacation-detail {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out;
            padding-top: 0;
        }
        
        .vacation-detail.open {
            max-height: 500px; /* Suficiente espacio para el contenido */
            padding-top: 10px;
        }
        
        #accumulation-dates {
            position: relative;
            max-height: 200px;
            overflow-y: auto;
            background: #3a3a3a;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            line-height: 1.8;
            font-size: 0.95rem;
            color: #e0e0e0;
            text-align: center;
            white-space: normal;
            scroll-behavior: smooth;
        }
        
        /* ✨ ESTILO PARA RESALTAR EL PRÓXIMO DÍA ✨ */
        .next-accumulation {
            color: #e0e0e0;
            font-weight: bold;
            background-color: #007bff;
            padding: 2px 5px;
            border-radius: 3px;
            display: inline-block;
            width: 90%;
            margin: 0 auto;
            border: 1px solid #ffffff;
        }

        /* ✨ ESTILOS DEL MODAL DE FESTIVOS Y PUENTES ✨ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.78);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background-color: #2a2a2a;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            width: 100%;
            max-width: 540px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            color: #dee2e6;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 2px solid #007bff;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 1.15rem;
            color: #ffffff;
        }
        .modal-close {
            background: transparent;
            border: none;
            color: #dee2e6;
            font-size: 1.5rem;
            line-height: 1;
            padding: 0 6px;
            cursor: pointer;
        }
        .modal-close:hover {
            background: transparent;
            color: #ff6b6b;
        }
        .modal-body {
            padding: 15px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .modal-note {
            font-size: 0.85rem;
            color: #adb5bd;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .holiday-card {
            background-color: #363636;
            border-left: 4px solid #007bff;
            border-radius: 5px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .holiday-card.past {
            opacity: 0.55;
            border-left-color: #6c757d;
        }
        .holiday-card.upcoming {
            border-left-color: #28a745;
            border: 1px solid #28a745;
            border-left-width: 5px;
            background-color: #2f3b32;
        }
        .holiday-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .holiday-date {
            font-weight: bold;
            color: #ffffff;
            font-size: 0.95rem;
        }
        .badge-next {
            background-color: #28a745;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 10px;
        }
        .holiday-name {
            font-size: 0.92rem;
            color: #ced4da;
            margin: 4px 0 6px 0;
        }
        .bridge-tip {
            font-size: 0.86rem;
            background-color: #242424;
            padding: 6px 9px;
            border-radius: 4px;
            color: #e9ecef;
            line-height: 1.4;
        }
        .bridge-highlight {
            color: #4dabf7;
            font-weight: bold;
        }
        .bridge-weekend {
            color: #adb5bd;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h2>Vacaciones</h2>

    <div class="container">
        <label for="fecha-ingreso-input">Fecha de Ingreso:</label>
        <input type="date" id="fecha-ingreso-input" value="2022-04-19" onchange="calcularVacaciones()"> 

        <label for="salario-diario-input">Salario Diario (Opcional - Prima Vacacional 50%):</label>
        <input type="number" id="salario-diario-input" placeholder="Ej. 500.00" step="0.01" min="0" oninput="calcularVacaciones()">

        <div class="button-group">
            <button onclick="calcularVacaciones()">Calcular Días</button>
            <button type="button" class="btn-secondary" onclick="abrirModalFestivos()">📅 Festivos y Puentes</button>
        </div>
    </div>

    <div id="resultados" class="result-box">
        Presiona "Calcular Días" para ver el progreso.
    </div>
    
    <div id="additional-info-container" class="result-box" style="margin-top: 15px; display: none;">
        <div class="toggle-section" onclick="toggleDetails()">
            + Información:
            <span id="toggle-icon">▼</span>
        </div>
        
        <div id="vacation-detail" class="vacation-detail">
            <div id="accumulation-dates"></div>
        </div>
    </div>

    <!-- MODAL DE DÍAS FESTIVOS Y PUENTES -->
    <div id="festivos-modal" class="modal-overlay" onclick="cerrarModalPorFondo(event)">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-festivos-titulo">
            <div class="modal-header">
                <h3 id="modal-festivos-titulo">Días Festivos y Puentes</h3>
                <button type="button" class="modal-close" onclick="cerrarModalFestivos()" aria-label="Cerrar">&times;</button>
            </div>
            <div class="modal-body" id="festivos-modal-body">
                <!-- Contenido generado dinámicamente -->
            </div>
        </div>
    </div>
    
    <script>
        // Tablas de días de vacaciones iniciales (hasta el Año 5)
        const DIAS_PRE_2023 = { 
            1: 10, 2: 14, 3: 16, 4: 18, 5: 20
        };

        const DIAS_POST_2023 = { 
            1: 12, 2: 14, 3: 16, 4: 18, 5: 20
        };
        
        const FECHA_REFORMA = new Date(Date.UTC(2023, 0, 1));
        const PORCENTAJE_PRIMA = 0.50; // 50% de prima vacacional

        const NOMBRES_DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        const NOMBRES_MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

        /* --- Funciones de lógica de vacaciones --- */

        function calcularDiasVacacionesFTL(anioServicioActual, diasBaseInicial) {
            if (anioServicioActual <= 5) return diasBaseInicial;
            // Art. 76 LFT: +2 días a partir del 6.º año y posteriormente cada 5 años (6-10: 22, 11-15: 24, etc.)
            const aniosDespuesDeCinco = anioServicioActual - 5; 
            const bloquesQuinquenales = Math.ceil(aniosDespuesDeCinco / 5);
            const diasAdicionales = bloquesQuinquenales * 2;
            return diasBaseInicial + diasAdicionales;
        }

        /* --- Funciones de utilidad de fechas y moneda --- */

        function createUtcDate(year, month, day) {
            return new Date(Date.UTC(year, month, day));
        }
        
        function addDays(date, days) {
            const result = new Date(date);
            result.setUTCDate(result.getUTCDate() + days);
            return result;
        }

        function formatDateForDisplay(date) {
            const day = String(date.getUTCDate()).padStart(2, '0');
            const month = String(date.getUTCMonth() + 1).padStart(2, '0');
            const year = date.getUTCFullYear();
            return `${day}/${month}/${year}`;
        }
        
        function formatDateForList(date) {
            const day = date.getUTCDate();
            const month = date.getUTCMonth() + 1;
            const year = date.getUTCFullYear();
            return `${day}/${month}/${year}`;
        }

        function formatShortDate(date) {
            const day = String(date.getUTCDate()).padStart(2, '0');
            const month = NOMBRES_MESES[date.getUTCMonth()];
            return `${day}/${month}`;
        }

        function formatCurrencyMXN(amount) {
            return amount.toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
        }

        function dateDiffInDays(date1, date2) {
            const msPerDay = 1000 * 60 * 60 * 24;
            return Math.floor((date1.getTime() - date2.getTime()) / msPerDay);
        }
        
        function determinarTablaDias(fechaIngreso) {
            return (fechaIngreso.getTime() >= FECHA_REFORMA.getTime()) ? DIAS_POST_2023 : DIAS_PRE_2023;
        }

        /* --- Lógica de Días Festivos Oficiales (Art. 74 LFT) y Puentes --- */

        function obtenerEnesimoLunesMes(year, monthIndex, n) {
            const primerDiaMes = createUtcDate(year, monthIndex, 1);
            const diaSemana = primerDiaMes.getUTCDay(); // 0 = Dom, 1 = Lun...
            const desplazamientoPrimerLunes = (1 - diaSemana + 7) % 7;
            const diaObjetivo = 1 + desplazamientoPrimerLunes + (n - 1) * 7;
            return createUtcDate(year, monthIndex, diaObjetivo);
        }

        function obtenerFestivosMexico(year) {
            const festivos = [
                { fecha: createUtcDate(year, 0, 1), nombre: 'Año Nuevo' },
                { fecha: obtenerEnesimoLunesMes(year, 1, 1), nombre: 'Día de la Constitución (en conmemoración del 5 de feb.)' },
                { fecha: obtenerEnesimoLunesMes(year, 2, 3), nombre: 'Natalicio de Benito Juárez (en conmemoración del 21 de mar.)' },
                { fecha: createUtcDate(year, 4, 1), nombre: 'Día del Trabajo' },
                { fecha: createUtcDate(year, 8, 16), nombre: 'Día de la Independencia de México' }
            ];

            // Transmisión del Poder Ejecutivo Federal: 1 de octubre cada 6 años a partir de 2024
            if (year >= 2024 && (year - 2024) % 6 === 0) {
                festivos.push({
                    fecha: createUtcDate(year, 9, 1),
                    nombre: 'Transmisión del Poder Ejecutivo Federal'
                });
            }

            festivos.push(
                { fecha: obtenerEnesimoLunesMes(year, 10, 3), nombre: 'Revolución Mexicana (en conmemoración del 20 de nov.)' },
                { fecha: createUtcDate(year, 11, 25), nombre: 'Navidad' }
            );

            return festivos;
        }

        function generarSugerenciaPuente(fechaUtc) {
            const diaSemana = fechaUtc.getUTCDay(); // 0 Dom, 1 Lun, 2 Mar, 3 Mié, 4 Jue, 5 Vie, 6 Sáb

            switch (diaSemana) {
                case 1: { // Lunes
                    const viernesPrevio = formatShortDate(addDays(fechaUtc, -3));
                    const martesSiguiente = formatShortDate(addDays(fechaUtc, 1));
                    return `✅ <span class="bridge-highlight">Puente oficial de 3 días</span> (Sáb–Lun).<br>💡 <strong>Extensión:</strong> Pide el <strong>viernes ${viernesPrevio}</strong> o <strong>martes ${martesSiguiente}</strong> (1 día = <strong>4 días libres</strong>).`;
                }
                case 2: { // Martes
                    const lunesPuente = formatShortDate(addDays(fechaUtc, -1));
                    return `🔥 <span class="bridge-highlight">¡Super puente!</span> Pide el <strong>lunes ${lunesPuente}</strong> (1 día de vacaciones = <strong>4 días seguidos</strong> de descanso).`;
                }
                case 3: { // Miércoles
                    const lun = formatShortDate(addDays(fechaUtc, -2));
                    const mar = formatShortDate(addDays(fechaUtc, -1));
                    const jue = formatShortDate(addDays(fechaUtc, 1));
                    const vie = formatShortDate(addDays(fechaUtc, 2));
                    return `⚡ <span class="bridge-highlight">Mega puente (5 días):</span> Pide <strong>lun ${lun} y mar ${mar}</strong>, o bien <strong>jue ${jue} y vie ${vie}</strong> (2 días = <strong>5 días libres</strong>).`;
                }
                case 4: { // Jueves
                    const viernesPuente = formatShortDate(addDays(fechaUtc, 1));
                    return `🔥 <span class="bridge-highlight">¡Super puente!</span> Pide el <strong>viernes ${viernesPuente}</strong> (1 día de vacaciones = <strong>4 días seguidos</strong> de descanso).`;
                }
                case 5: { // Viernes
                    const juevesPrevio = formatShortDate(addDays(fechaUtc, -1));
                    const lunesSiguiente = formatShortDate(addDays(fechaUtc, 3));
                    return `✅ <span class="bridge-highlight">Puente oficial de 3 días</span> (Vie–Dom).<br>💡 <strong>Extensión:</strong> Pide el <strong>jueves ${juevesPrevio}</strong> o <strong>lunes ${lunesSiguiente}</strong> (1 día = <strong>4 días libres</strong>).`;
                }
                default: // Sábado (6) o Domingo (0)
                    return `<span class="bridge-weekend">Cae en fin de semana (sin puente natural adicional).</span>`;
            }
        }

        function renderizarModalFestivos() {
            const hoy = new Date();
            const anioActual = hoy.getFullYear();
            const hoyUtc = createUtcDate(anioActual, hoy.getMonth(), hoy.getDate());
            const festivos = obtenerFestivosMexico(anioActual);

            document.getElementById('modal-festivos-titulo').innerText = `Festivos Oficiales y Puentes ${anioActual}`;

            let proximoEncontrado = false;
            let html = `<p class="modal-note">Descansos obligatorios conforme al Art. 74 de la LFT y combinaciones sugeridas (considerando descanso sábado y domingo):</p>`;

            festivos.forEach(item => {
                const esPasado = item.fecha.getTime() < hoyUtc.getTime();
                let claseCard = '';
                let badgeHtml = '';
                let idHtml = '';

                if (esPasado) {
                    claseCard = 'past';
                } else if (!proximoEncontrado) {
                    proximoEncontrado = true;
                    claseCard = 'upcoming';
                    badgeHtml = `<span class="badge-next">Próximo festivo</span>`;
                    idHtml = `id="proximo-festivo-card"`;
                }

                const nombreDia = NOMBRES_DIAS[item.fecha.getUTCDay()];
                const fechaTexto = `${nombreDia} ${formatDateForDisplay(item.fecha)}`;
                const sugerencia = generarSugerenciaPuente(item.fecha);

                html += `
                    <div ${idHtml} class="holiday-card ${claseCard}">
                        <div class="holiday-top">
                            <span class="holiday-date">${fechaTexto}</span>
                            ${badgeHtml}
                        </div>
                        <div class="holiday-name">${item.nombre}</div>
                        <div class="bridge-tip">${sugerencia}</div>
                    </div>
                `;
            });

            document.getElementById('festivos-modal-body').innerHTML = html;
        }

        function abrirModalFestivos() {
            renderizarModalFestivos();
            const modal = document.getElementById('festivos-modal');
            modal.classList.add('active');

            // Centrar automáticamente el próximo día festivo dentro del modal
            setTimeout(() => {
                const body = document.getElementById('festivos-modal-body');
                const nextCard = document.getElementById('proximo-festivo-card');
                if (body && nextCard) {
                    const targetScroll = nextCard.offsetTop - (body.clientHeight / 2) + (nextCard.clientHeight / 2);
                    body.scrollTop = Math.max(0, targetScroll);
                }
            }, 100);
        }

        function cerrarModalFestivos() {
            document.getElementById('festivos-modal').classList.remove('active');
        }

        function cerrarModalPorFondo(event) {
            if (event.target.id === 'festivos-modal') {
                cerrarModalFestivos();
            }
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                cerrarModalFestivos();
            }
        });

        /**
         * Calcula, genera la lista y RESALTA la próxima fecha de acumulación.
         */
        function mostrarFechasAcumulacion(fechaInicioPeriodo, diasVacacionesTotales, diasTotalesPeriodo) {
            const hoyUtc = createUtcDate(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
            const diasAcumularUnDia = diasTotalesPeriodo / diasVacacionesTotales;
            let outputHtml = '';
            let isNextFound = false;
            
            if (diasVacacionesTotales <= 0 || diasTotalesPeriodo <= 0) {
                document.getElementById("accumulation-dates").innerHTML = "No aplica acumulación de días.";
                return;
            }

            for (let i = 1; i <= diasVacacionesTotales; i++) {
                const diasParaAcumular = Math.round(diasAcumularUnDia * i);
                const fechaAcumulacion = addDays(fechaInicioPeriodo, diasParaAcumular);
                
                let className = '';
                let idAttr = '';
                if (!isNextFound && fechaAcumulacion.getTime() >= hoyUtc.getTime()) {
                    className = 'next-accumulation';
                    idAttr = 'id="next-day-item"';
                    isNextFound = true;
                }
                
                const lineContent = `<span ${idAttr} class="${className}">${formatDateForList(fechaAcumulacion)} - Día ${i}°</span>`;
                outputHtml += lineContent + '<br>';
            }
            
            document.getElementById("accumulation-dates").innerHTML = outputHtml;
        }

        /**
         * Maneja el despliegue del panel de información adicional y centra el próximo día.
         */
        function toggleDetails() {
            const detailDiv = document.getElementById('vacation-detail');
            const iconSpan = document.getElementById('toggle-icon');
            detailDiv.classList.toggle('open');
            const isOpen = detailDiv.classList.contains('open');
            iconSpan.innerText = isOpen ? '▲' : '▼';

            if (isOpen) {
                setTimeout(() => {
                    const container = document.getElementById('accumulation-dates');
                    const nextItem = document.getElementById('next-day-item');
                    if (container && nextItem) {
                        const targetScroll = nextItem.offsetTop - (container.clientHeight / 2) + (nextItem.clientHeight / 2);
                        container.scrollTop = Math.max(0, targetScroll);
                    }
                }, 150);
            }
        }

        /* --- Lógica principal de cálculo --- */

        function calcularVacaciones() {
            const inputDateString = document.getElementById('fecha-ingreso-input').value;
            const salarioDiario = parseFloat(document.getElementById('salario-diario-input').value);

            if (!inputDateString) {
                document.getElementById('resultados').innerHTML = 'Por favor, introduce una fecha de ingreso válida.';
                document.getElementById('additional-info-container').style.display = 'none';
                return;
            }
            
            // 1. Inicialización de la Fecha de Ingreso y componentes (en UTC)
            const [year, month, day] = inputDateString.split('-').map(Number);
            const fechaIngreso = createUtcDate(year, month - 1, day); 
            
            const mesIngreso = month - 1; 
            const diaIngreso = day;
            
            const hoy = new Date();
            const hoyUtc = createUtcDate(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
            
            const diasPorAnio = determinarTablaDias(fechaIngreso);
            
            // 2. Determinar el año de servicio actual
            let aniosServicio = hoyUtc.getFullYear() - fechaIngreso.getFullYear();
            const aniversarioEsteAnio = createUtcDate(hoyUtc.getFullYear(), mesIngreso, diaIngreso);
            if (hoyUtc < aniversarioEsteAnio) aniosServicio -= 1;
            aniosServicio = Math.max(0, aniosServicio); 

            // 3. Definir fechas y días
            const anioServicioActual = aniosServicio + 1;
            const fechaAniversarioPasado = createUtcDate(fechaIngreso.getFullYear() + aniosServicio, mesIngreso, diaIngreso);
            const siguienteAniversario = createUtcDate(fechaIngreso.getFullYear() + anioServicioActual, mesIngreso, diaIngreso);
            const fechaFinPeriodo = new Date(siguienteAniversario.getTime() - (1000 * 60 * 60 * 24)); 

            // 4. Días de Vacaciones Totales
            let diasVacaciones;
            const diasBaseQuinquenal = diasPorAnio[5]; 
            if (anioServicioActual <= 5) {
                diasVacaciones = diasPorAnio[anioServicioActual];
            } else {
                diasVacaciones = calcularDiasVacacionesFTL(anioServicioActual, diasBaseQuinquenal);
            }

            // 5. Cálculos del Período
            const diasTranscurridosPeriodo = dateDiffInDays(hoyUtc, fechaAniversarioPasado);
            const diasTotalesPeriodo = dateDiffInDays(fechaFinPeriodo, fechaAniversarioPasado) + 1; 
            
            if (diasTotalesPeriodo <= 0) {
                document.getElementById('resultados').innerHTML = 'Error en el cálculo del periodo (días totales). Revisa la fecha de ingreso.';
                document.getElementById('additional-info-container').style.display = 'none';
                return;
            }

            // 6. Cálculo del progreso y pro-rateo
            const porcentajeProgreso = Math.min(1, diasTranscurridosPeriodo / diasTotalesPeriodo);
            const diasVacacionesGanados = diasVacaciones * porcentajeProgreso;
            const diasAcumularDia = (diasTotalesPeriodo / diasVacaciones);
            const diasPorDia = (diasVacaciones / diasTotalesPeriodo);

            // 6.1 Cálculo de Prima Vacacional al 50% (si se ingresó salario diario)
            let primaVacacionalHTML = '';
            if (!isNaN(salarioDiario) && salarioDiario > 0) {
                const primaTotalPeriodo = diasVacaciones * salarioDiario * PORCENTAJE_PRIMA;
                const primaAcumuladaHoy = diasVacacionesGanados * salarioDiario * PORCENTAJE_PRIMA;
                primaVacacionalHTML = `
                    <hr style="border-top: 1px solid #555;">
                    <p class="color_label"><strong>Prima vacacional proporcional (50%):</strong> <span style="font-size: 1.15em; color: #28a745;">${formatCurrencyMXN(primaAcumuladaHoy)}</span></p>
                    <p class="color_label"><strong>Prima vacacional total del año (50%):</strong> <span style="color: #007bff;">${formatCurrencyMXN(primaTotalPeriodo)}</span></p>
                `;
            }
            
            // 7. Generación de la Barra de Progreso (HTML/CSS)
            const porcentajeFormato = (porcentajeProgreso * 100).toFixed(2);
            
            const progressBarHtml = `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${porcentajeFormato}%;">
                        ${porcentajeFormato}%
                    </div>
                </div>
            `;
            
            // 8. Formato de Salida
            const formatoFechaDisplay = { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' };

            const resultadosHTML = `
                <p class="color_label"><strong>Fecha de Ingreso:</strong> ${fechaIngreso.toLocaleDateString('es-ES', formatoFechaDisplay)}</p>
                <p class="color_label"><strong>Año de antigüedad en curso:</strong> ${anioServicioActual}</p>
                <p class="color_label"><strong>Vacaciones para este año:</strong> <span style="font-size: 1.2em; color: #007bff;">${diasVacaciones} días</span></p>
                <hr style="border-top: 1px solid #555;">
                <p class="color_label"><strong>Período Actual:</strong> ${formatDateForDisplay(fechaAniversarioPasado)} a ${formatDateForDisplay(fechaFinPeriodo)}</p>
                <p class="color_label"><strong>Días Transcurridos:</strong> ${diasTranscurridosPeriodo} de ${diasTotalesPeriodo}</p>
                <p class="color_label"><strong>Día de vacacion generado cada:</strong> ${diasAcumularDia.toFixed(2)} días</p>
                <p class="color_label"><strong>Vacaciones actuales:</strong> <span style="font-size: 1.2em; color: #28a745;">${diasVacacionesGanados.toFixed(2)} días / ${diasVacaciones} días</span></p>
                <p class="color_label"><strong>Días generados por día:</strong> <span style="font-size: 1em; color: #007bff;"> ${diasPorDia.toFixed(4)} días</span></p>
                ${primaVacacionalHTML}
                ${progressBarHtml}
            `;

            document.getElementById('resultados').innerHTML = resultadosHTML;
            document.getElementById('additional-info-container').style.display = 'block';

            // 9. Generación de Fechas de Acumulación
            mostrarFechasAcumulacion(fechaAniversarioPasado, diasVacaciones, diasTotalesPeriodo);
        }

        // Ejecutar al cargar la página con la fecha por defecto
        document.addEventListener('DOMContentLoaded', calcularVacaciones);

    </script>
</body>
</html>
